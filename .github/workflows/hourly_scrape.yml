name: Hourly Macro Data Scrape

on:
  schedule:
    # Run every 2 hours (to save Actions quota, CME updates daily anyway)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run scraper
        run: node scripts/fetch_macro.js
        continue-on-error: true  # Don't fail workflow on fetch errors
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet data/history.json || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/history.json
          git commit -m "📊 Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
